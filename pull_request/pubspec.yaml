name: pull_request
description: "A new Flutter project."
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.10.8

dependencies:
  flutter:
    sdk: flutter

  # State management
  provider: ^6.1.2

  # Declarative routing with deep-link support
  go_router: ^14.6.3

  # OAuth browser launch + custom-scheme redirect interception
  flutter_web_auth_2: ^4.0.1

  # Encrypted key/token persistence
  flutter_secure_storage: ^9.2.2

  # HTTP client for backend API calls
  http: ^1.2.0

  # RSA keypair generation and signing for device authentication
  fast_rsa: ^3.6.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/icons/spotify_icon.png
    - assets/icons/youtube_music_icon.png
