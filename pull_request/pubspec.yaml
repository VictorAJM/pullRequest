name: pull_request
description: "A new Flutter project."
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.10.8

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State management
  provider: ^6.1.2

  # Declarative routing with deep-link support
  go_router: ^14.6.3

  # OAuth browser launch + custom-scheme redirect interception
  flutter_web_auth_2: ^4.0.1

  # Encrypted token persistence (access + refresh tokens)
  flutter_secure_storage: ^9.2.2

  # HTTP client for token exchange and refresh grant calls
  http: ^1.2.0

  # SHA-256 for PKCE code challenge generation
  crypto: ^3.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/icons/spotify_icon.png
    - assets/icons/youtube_music_icon.png
    - assets/data/spotify_playlists.json
    - assets/data/youtube_music_playlists.json
